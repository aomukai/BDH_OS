schema_version = 1

[machine]
id = "trainbox"
display_name = "Ninereeds Training Environment"
role = "trainbox"
hostname = "ninereeds"
enabled = true
maintenance_mode = false
max_concurrent_jobs = 1
allowed_job_types = ["system.healthcheck", "system.artifact_roundtrip", "system.gpu_probe", "corpus.transform", "corpus.validate", "model.initialize", "model.train", "model.evaluate", "model.multimodal_evaluate", "model.chat", "model.visual_train", "model.multimodal_train", "model.merge", "checkpoint.certify", "checkpoint.probe", "checkpoint.compare", "executor.generate", "visual.generate", "visual.inspect", "visual.caption", "visual.review", "visual.encode"]
state_root = "/home/aomukai/.local/share/ninereeds/trainbox-agent"
artifact_roots = ["/home/aomukai/Ninereeds/core", "/home/aomukai/Ninereeds/checkpoints", "/home/aomukai/.local/share/ninereeds/trainbox-agent/artifacts", "/home/aomukai/.local/share/ninereeds/visual", "/home/aomukai/.local/share/ninereeds-archives"]
capabilities = ["cuda", "gpu_12gb_x2", "cortex", "local_executor", "vision_generation", "vision_judge", "vision_encoder"]
transport = "restricted_ssh"
ssh_target = "ninereeds-trainbox-agent"
dispatch_timeout_seconds = 60
artifact_transfer_timeout_seconds = 300
release_install_root = "/home/aomukai/.local/share/ninereeds/releases/trainbox"
active_release_link = "/home/aomukai/.local/share/ninereeds/releases/trainbox/current"
