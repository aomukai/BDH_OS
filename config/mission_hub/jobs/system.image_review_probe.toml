schema_version = 1

[job]
id = "system.image_review_probe"
version = 1
description = "Provision one pinned GGUF vision model and compare one-versus-two GPU review throughput."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.image_review_probe:ImageReviewProbeHandler"
enabled = true
requires_live_execution = true
critical = false
priority = 95
timeout_seconds = 10800
max_attempts = 1
retry_policy = "never"
input_schema = "schemas/mission_hub/jobs/system.image_review_probe.input.schema.json"
output_schema = "schemas/mission_hub/jobs/generic.output.schema.json"
artifact_types = ["image_review_probe_report", "log"]
required_artifact_types = ["image_review_probe_report", "log"]
artifact_input_fields = []
required_capabilities = ["cuda", "gpu_12gb_x2", "vision_judge"]
approval = "operator"
provider_route = "deterministic"
prompt_id = "none"
