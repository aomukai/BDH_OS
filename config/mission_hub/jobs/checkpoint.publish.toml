schema_version = 1

[job]
id = "checkpoint.publish"
version = 1
description = "Record an explicit checkpoint publication decision and location."
owner = "mission_hub"
executor_role = "mission_hub"
handler = "mission_hub.handlers.disabled:DisabledHandler"
enabled = false
requires_live_execution = true
critical = true
priority = 90
timeout_seconds = 300
max_attempts = 1
retry_policy = "never"
input_schema = "schemas/mission_hub/jobs/generic.input.schema.json"
output_schema = "schemas/mission_hub/jobs/generic.output.schema.json"
artifact_types = ["checkpoint_manifest"]
required_artifact_types = ["checkpoint_manifest"]
artifact_input_fields = ["checkpoint_artifact_id", "evaluation_artifact_id"]
required_capabilities = ["control"]
approval = "operator"
provider_route = "deterministic"
prompt_id = ""
