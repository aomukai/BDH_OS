schema_version = 1

[job]
id = "checkpoint.certify"
version = 1
description = "Content-certify checkpoint bytes and emit an immutable manifest without deserialization."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.contracts:CheckpointCertifyHandler"
enabled = true
requires_live_execution = false
critical = true
priority = 70
timeout_seconds = 1800
max_attempts = 1
retry_policy = "operator_after_evidence"
input_schema = "schemas/mission_hub/jobs/checkpoint.certify.input.schema.json"
output_schema = "schemas/mission_hub/jobs/checkpoint.certify.output.schema.json"
artifact_types = ["checkpoint", "checkpoint_manifest"]
required_artifact_types = ["checkpoint", "checkpoint_manifest"]
artifact_input_fields = ["parent_checkpoint_artifact_id"]
required_capabilities = ["cortex"]
approval = "operator"
provider_route = "deterministic"
prompt_id = ""
