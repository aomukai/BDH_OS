schema_version = 1
[job]
id = "visual.inspect"
version = 1
description = "Run mechanical gates and blind visual observation over candidates."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.visual:VisualInspectHandler"
enabled = true
requires_live_execution = true
critical = true
priority = 45
timeout_seconds = 21600
max_attempts = 2
retry_policy = "classified"
input_schema = "schemas/mission_hub/jobs/visual-stage.input.schema.json"
output_schema = "schemas/mission_hub/jobs/visual-stage.output.schema.json"
artifact_types = ["visual_inspection_report", "provider_transcript", "log"]
required_artifact_types = ["visual_inspection_report", "provider_transcript", "log"]
artifact_input_fields = ["input_artifact_ids"]
required_capabilities = ["cuda", "vision_judge"]
approval = "none"
provider_route = "visual-observation"
prompt_id = "visual-inspect-v1"
