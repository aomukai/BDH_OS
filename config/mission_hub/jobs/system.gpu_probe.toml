schema_version = 1

[job]
id = "system.gpu_probe"
version = 2
description = "Run bounded tensor arithmetic on explicitly selected GPUs without loading a model."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.commissioning:BoundedGPUProbeHandler"
enabled = true
requires_live_execution = true
priority = 94
timeout_seconds = 60
max_attempts = 1
retry_policy = "never"
input_schema = "schemas/mission_hub/jobs/system.gpu_probe.input.schema.json"
output_schema = "schemas/mission_hub/jobs/system.gpu_probe.output.schema.json"
artifact_types = ["gpu_probe_report"]
artifact_input_fields = []
required_capabilities = ["cuda"]
approval = "operator"
provider_route = "deterministic"
prompt_id = "none"
