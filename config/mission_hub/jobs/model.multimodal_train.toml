schema_version = 1

[job]
id = "model.multimodal_train"
version = 1
description = "Train an authorized full-Cortex visual-only or interspersed text-image session in exact dependency order."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.multimodal_train:MultimodalCortexTrainHandler"
enabled = true
requires_live_execution = true
critical = true
priority = 80
timeout_seconds = 86400
max_attempts = 1
retry_policy = "operator_after_evidence"
input_schema = "schemas/mission_hub/jobs/model.multimodal_train.input.schema.json"
output_schema = "schemas/mission_hub/jobs/visual-stage.output.schema.json"
artifact_types = ["checkpoint", "training_report", "gate_credit_report", "log"]
required_artifact_types = ["checkpoint", "training_report", "gate_credit_report", "log"]
artifact_input_fields = ["input_artifact_ids"]
required_capabilities = ["cuda", "gpu_12gb_x2", "cortex", "vision_encoder"]
approval = "operator"
provider_route = "deterministic"
prompt_id = ""
