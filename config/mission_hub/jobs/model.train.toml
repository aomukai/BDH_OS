schema_version = 1

[job]
id = "model.train"
version = 2
description = "Train one declared model lineage only after its ordered concepts, prerequisites, parent knowledge, and exact input bytes are certified together."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.cortex:CortexTrainHandler"
enabled = true
requires_live_execution = true
critical = true
priority = 70
timeout_seconds = 86400
max_attempts = 2
retry_policy = "operator_after_evidence"
input_schema = "schemas/mission_hub/jobs/model.train.input.schema.json"
output_schema = "schemas/mission_hub/jobs/generic.output.schema.json"
artifact_types = ["checkpoint", "training_report", "gate_credit_report", "log"]
required_artifact_types = ["checkpoint", "training_report", "log"]
artifact_input_fields = ["parent_artifact_id", "corpus_artifact_id", "order_validation_artifact_id"]
required_capabilities = ["cuda", "cortex"]
approval = "operator"
provider_route = "deterministic"
prompt_id = ""
