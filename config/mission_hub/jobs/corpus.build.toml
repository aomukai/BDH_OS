schema_version = 1

[job]
id = "corpus.build"
version = 2
description = "Build a deterministic corpus artifact from an immutable manifest."
owner = "mission_hub"
executor_role = "mission_hub"
handler = "mission_hub.handlers.contracts:CorpusBuildHandler"
enabled = true
requires_live_execution = false
critical = true
priority = 40
timeout_seconds = 7200
max_attempts = 1
retry_policy = "infrastructure_only"
input_schema = "schemas/mission_hub/jobs/corpus.build.input.schema.json"
output_schema = "schemas/mission_hub/jobs/corpus.build.output.schema.json"
artifact_types = ["corpus", "corpus_manifest"]
required_artifact_types = ["corpus", "corpus_manifest"]
artifact_input_fields = []
required_capabilities = []
approval = "operator"
provider_route = "deterministic"
prompt_id = ""
