schema_version = 1

[job]
id = "system.artifact_roundtrip"
version = 1
description = "Read one materialized commissioning artifact and emit a deterministic receipt."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.commissioning:ArtifactRoundtripHandler"
enabled = true
requires_live_execution = false
priority = 95
timeout_seconds = 30
max_attempts = 1
retry_policy = "never"
input_schema = "schemas/mission_hub/jobs/system.artifact_roundtrip.input.schema.json"
output_schema = "schemas/mission_hub/jobs/system.artifact_roundtrip.output.schema.json"
artifact_types = ["commissioning_receipt"]
artifact_input_fields = ["input_artifact_id"]
required_capabilities = []
approval = "operator"
provider_route = "deterministic"
prompt_id = "none"
