schema_version = 1

[job]
id = "model.chat"
version = 1
description = "Generate one immutable checkpoint-pinned Ninereeds conversation turn without changing model state."
owner = "mission_hub"
executor_role = "trainbox"
handler = "mission_hub.handlers.cortex:CortexChatHandler"
enabled = true
requires_live_execution = true
critical = true
priority = 95
timeout_seconds = 3600
max_attempts = 2
retry_policy = "infrastructure_only"
input_schema = "schemas/mission_hub/jobs/model.chat.input.schema.json"
output_schema = "schemas/mission_hub/jobs/generic.output.schema.json"
artifact_types = ["chat_report", "log"]
required_artifact_types = ["chat_report", "log"]
artifact_input_fields = ["checkpoint_artifact_id"]
required_capabilities = ["cuda", "cortex"]
approval = "none"
provider_route = "deterministic"
prompt_id = ""
