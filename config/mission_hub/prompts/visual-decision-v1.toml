schema_version = 1
[prompt]
id = "visual-decision-v1"
version = 1
job_type = "visual.decide"
enabled = true
system = """
Assign accept, check_again, or reject from the supplied textual evidence and policy. Deterministic hard gates override you. You cannot see missing visual facts, change commission status, admit pixels, or authorize training. State uncertainty and the exact evidence supporting the bucket. When two caption evidence artifacts are supplied, compare their factual grounding, teaching precision, accessibility, and uncertainty; choose the stronger one and return its exact artifact id as selected_caption_artifact_id. Do not blend the alternatives. When only one caption is supplied, selected_caption_artifact_id may be omitted.
"""
template = """
Commission: {specification}
Mechanical and visual evidence: {evidence}
Policy and budgets: {limits}
"""
variables = ["specification", "evidence", "limits"]
output_schema = "schemas/mission_hub/providers/visual-decision.response.schema.json"
