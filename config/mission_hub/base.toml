schema_version = 1

[hub]
state_root = "/home/aomukai/.local/share/ninereeds/mission-hub"
database_name = "mission-hub.sqlite3"
busy_timeout_ms = 5000
event_chain = true

[safety]
live_execution = false
automatic_pruning = false
automatic_campaign_rollover = false
allow_git_mutation = false
require_release_match = true
require_config_match = true

[scheduler]
poll_seconds = 15
lease_seconds = 900
heartbeat_seconds = 30
stale_after_seconds = 120
max_attempts_default = 1
max_queue_age_seconds = 86400

[artifacts]
manifest_algorithm = "sha256"
deletion_requires_approval = true
retention_mode = "report_only"
max_transfer_bytes = 1073741824
transfer_chunk_bytes = 1048576

[commissioning]
max_artifact_input_bytes = 1048576
gpu_max_devices = 2
gpu_max_matrix_size = 1024
gpu_max_iterations = 8
gpu_max_duration_seconds = 30
gpu_max_allocated_bytes = 67108864
gpu_max_start_temperature_c = 80

[protocol]
version = 1
max_envelope_bytes = 262144
clock_skew_seconds = 30

[api]
host = "127.0.0.1"
port = 8770
auth_token_env = "NINEREEDS_MISSION_HUB_API_TOKEN"
max_request_bytes = 1048576

[failure_logging]
enabled = true
root = "/home/aomukai/.local/share/ninereeds/mission-hub/critical-failures"
retention_days = 7
max_message_characters = 12000

[emergency]
mode = "disabled"
invoke_on_critical_failure = true
executable = "/home/aomukai/.local/bin/codex"
model = "gpt-5.6-sol"
timeout_seconds = 1200
max_incident_bytes = 65536
response_schema = "schemas/mission_hub/emergency/sol-advisory.schema.json"

[contracts]
training_library_root = "/home/aomukai/Ninereeds/training_data"
corpus_max_source_files = 4096
corpus_max_source_bytes = 1073741824
checkpoint_max_bytes = 2147483648
checkpoint_roots = ["/home/aomukai/Ninereeds/core", "/home/aomukai/Ninereeds/checkpoints"]
