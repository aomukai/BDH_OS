schema_version = 1

[hub]
state_root = "/home/aomukai/.local/share/ninereeds/mission-hub"
database_name = "mission-hub.sqlite3"
busy_timeout_ms = 5000
event_chain = true

[safety]
live_execution = true
automatic_pruning = true
automatic_campaign_rollover = false
allow_git_mutation = false
require_release_match = true
require_config_match = true

[scheduler]
poll_seconds = 15
lease_seconds = 900
heartbeat_seconds = 30
stale_after_seconds = 120
max_attempts_default = 1
max_queue_age_seconds = 86400

[training]
order_policy = "declared_only"
shuffle_allowed = false
dependency_order_required = true
max_examples_per_session = 10000
max_completion_utf8_bytes = 512

[training.observer_fixture]
id = "gate-credit-v1"
version = 1
required = true
log_every_n_steps = 50
max_sampled_steps = 64

[evaluation]
basis = ["behavioral_chat", "mri_activation"]
loss_role = "telemetry_only"

[orchestration]
strategic_boundary_cooldown_seconds = 900

[model_defaults]
unlisted_context_tokens = 128000
unlisted_output_tokens = 8192

[visual]
shadow_mode = false
stage_cooldown_seconds = 900
store_root = "/home/aomukai/.local/share/ninereeds/visual"
max_pack_items = 128
max_candidates_per_item = 4
max_width = 1024
max_height = 1024
max_generation_steps = 16
max_stage_seconds = 21600
max_pack_bytes = 10737418240
minimum_free_bytes = 53687091200
independent_review_required = true

[artifacts]
manifest_algorithm = "sha256"
deletion_requires_approval = false
retention_mode = "protected_registry_automatic"
max_transfer_bytes = 1073741824
transfer_chunk_bytes = 1048576

[commissioning]
max_artifact_input_bytes = 1048576
gpu_max_devices = 2
gpu_max_matrix_size = 1024
gpu_max_iterations = 8
gpu_max_duration_seconds = 30
gpu_max_allocated_bytes = 67108864
gpu_max_start_temperature_c = 80

[protocol]
version = 1
max_envelope_bytes = 262144
clock_skew_seconds = 30

[api]
host = "127.0.0.1"
port = 8770
auth_token_env = "NINEREEDS_MISSION_HUB_API_TOKEN"
max_request_bytes = 1048576

[failure_logging]
enabled = true
root = "/home/aomukai/.local/share/ninereeds/mission-hub/critical-failures"
retention_days = 7
max_message_characters = 12000

[emergency]
mode = "disabled"
invoke_on_critical_failure = false
executable = "/home/aomukai/.local/bin/codex"
model = "gpt-5.6-sol"
timeout_seconds = 1200
max_incident_bytes = 65536
response_schema = "schemas/mission_hub/emergency/sol-advisory.schema.json"

[recovery]
enabled = true
source_repository_root = "/home/aomukai/Ninereeds"
# Compatibility value retained for older deployed role validators. Sol's
# on-call manager does not enforce a numeric attempt ceiling; each attempt is
# independently bounded by scope, time, tests, and deployment verification.
max_repair_attempts = 2
max_changed_files = 24
max_patch_bytes = 262144
attempt_timeout_seconds = 1800
automated_sol_min_interval_seconds = 60
identical_incident_quiet_seconds = 900
allowed_source_roots = ["mission_hub", "config/mission_hub", "schemas/mission_hub", "tests"]
protected_paths = ["core", "checkpoints", "training_data", "archive", ".git"]
targeted_test_commands = [["python3", "-m", "pytest", "-q", "tests/test_operational_response.py", "tests/test_mission_hub_recovery.py"]]
regression_test_commands = [["python3", "-m", "pytest", "-q"]]

[contracts]
training_library_root = "/home/aomukai/Ninereeds/training_data"
corpus_max_source_files = 4096
corpus_max_source_bytes = 1073741824
checkpoint_max_bytes = 17179869184
checkpoint_roots = ["/home/aomukai/Ninereeds/core", "/home/aomukai/Ninereeds/checkpoints"]
